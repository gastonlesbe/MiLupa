apply plugin: 'com.android.application'

// Firma: las claves van en .env (no versionado) o en variables de entorno
def signingEnv = [:]
def signingEnvFile = rootProject.file(".env")
if (signingEnvFile.exists()) {
    signingEnvFile.eachLine { line ->
        def m = line =~ /^\s*([A-Z_]+)\s*=\s*(.*?)\s*$/
        if (m.matches()) signingEnv[m.group(1)] = m.group(2)
    }
}
def signingValue = { String key -> signingEnv[key] ?: System.getenv(key) }

android {
    compileSdk 36
    ndkVersion "26.1.10909125"
    defaultConfig {
        applicationId "lesbegueris.gaston.com.milupa"
        minSdkVersion 23  // Updated to support Appodeal SDK 3.8.0.0 (requires minSdk 23)
        targetSdk 36
        versionName '2.10.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 44
    }

    signingConfigs {
        release {
            if (signingValue('KEYSTORE_FILE')) {
                storeFile file(signingValue('KEYSTORE_FILE'))
                storePassword signingValue('KEYSTORE_PASSWORD')
                keyAlias signingValue('KEY_ALIAS')
                keyPassword signingValue('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    
    lint {
        checkReleaseBuilds false
    }
    
    buildToolsVersion '35.0.0'
    namespace 'lesbegueris.gaston.com.milupa'
}

allprojects {
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.6.1', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-ads:25.2.0'
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.play:review:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Force current Play Billing Library: without this, excluding the Appodeal
    // "appsflyer" services module below removes the only dependency that was
    // forcing com.my.tracker's billingclient range [7.0.0, 8.0.0) up to 8.0.0,
    // so Gradle resolved it down to the old 7.1.1 floor instead. (Same version
    // as MiLinterna, which already declares this directly.)
    implementation 'com.android.billingclient:billing:8.0.0'

    // Appodeal SDK (same version as MyLinterna)
    implementation("com.appodeal.ads:sdk:3.12.0.1") {
        exclude group: "com.appodeal.ads.sdk.services", module: "adjust"
        exclude group: "com.appodeal.ads.sdk.services", module: "appsflyer"
        exclude group: "com.appodeal.ads.sdk.services", module: "facebook_analytics"
        exclude group: "com.appodeal.ads.sdk.services", module: "firebase"
        exclude group: "com.appodeal.ads.sdk.services", module: "sentry_analytics"
    }
}
